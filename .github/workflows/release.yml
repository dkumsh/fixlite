name: 🚀 Release

# Give the GITHUB_TOKEN write access to contents (tags & releases)
permissions:
  contents: write
  
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Install Rust + rustfmt & clippy
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      # 3. Format, lint & test all workspace crates
      - name: Test, format & lint
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings
          cargo test

      # 4a. Real publish ─ only on tag pushes
      - name: Publish fixlite
        if: github.event_name == 'push'
        run: cargo publish -p fixlite
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish fixlite_derive
        if: github.event_name == 'push'
        run: cargo publish -p fixlite_derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # 4b. Dry-run publish ─ only on manual dispatch
      - name: Dry-run publish fixlite
        if: github.event_name == 'workflow_dispatch'
        run: cargo publish --dry-run -p fixlite
      - name: Dry-run publish fixlite_derive
        if: github.event_name == 'workflow_dispatch'
        run: cargo publish --dry-run -p fixlite_derive

  create-github-release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Create the GitHub Release ─ only on tag pushes
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
