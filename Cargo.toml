[workspace.package]
authors = ["Dmitriy Kumshayev"]
description = "FIX parser library"
license = "MIT OR LGPL-3.0-or-later"
repository = "https://github.com/dkumsh/fixlite"
edition = "2024"
keywords = ["fix", "serialization"]
version = "0.3.20"
readme = "README.md"

[workspace]
resolver = "2"

members = ["fixlite", "fixlite_derive", "fixlite_example"]

[workspace.dependencies]
chrono = "0.4"
thiserror = "1.0"
quote = "1.0.37"
syn = {  version = "2.0.96", features = ["derive", "visit-mut"] }

