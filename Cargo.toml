[workspace.package]
authors = []
description = "FIX parser"
edition = "2021"
keywords = ["fix"]
version = "0.0.0"

[workspace]
resolver = "2"

members = ["fix", "fix_derive", "fix_example"]

[workspace.dependencies]
chrono = "0.4"
thiserror = "1.0"
once_cell = "1.20.2"
quote = "1.0.37"
syn = {  version = "2.0.96", features = ["derive", "visit-mut"] }

